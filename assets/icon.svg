<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a066"/><stop offset=".5" stop-color="#f0c48a"/><stop offset="1" stop-color="#b9783f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3ad"/><stop offset=".5" stop-color="#f2f4f6"/><stop offset="1" stop-color="#8a929b"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f6d"/><stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="412" rx="185" fill="#fff" opacity=".10"/>
  <!-- paint stroke on the canvas -->
  <path d="M215 790 C 330 700, 420 800, 540 735 S 760 690, 820 760" fill="none" stroke="url(#paint)" stroke-width="58" stroke-linecap="round" opacity=".95"/>
  <!-- brush, drawn upright then rotated to point down-left -->
  <g transform="translate(512 470) rotate(40)" filter="url(#sh)">
    <!-- handle -->
    <path d="M-34 -330 Q-30 -352 0 -352 Q30 -352 34 -330 L52 40 L-52 40 Z" fill="url(#wood)"/>
    <rect x="-8" y="-300" width="16" height="120" rx="8" fill="#fff" opacity=".25"/>
    <!-- ferrule -->
    <path d="M-56 36 L56 36 L62 150 L-62 150 Z" fill="url(#metal)"/>
    <rect x="-62" y="62" width="124" height="10" fill="#6b727a" opacity=".45"/>
    <rect x="-60" y="104" width="120" height="10" fill="#6b727a" opacity=".45"/>
    <!-- bristles -->
    <path d="M-62 148 L62 148 C 78 215, 52 275, 0 330 C -52 275, -78 215, -62 148 Z" fill="#3a3a3c"/>
    <!-- paint on tip -->
    <path d="M-48 232 C -40 270, -22 300, 0 330 C 22 300, 40 270, 48 232 C 25 246, -25 246, -48 232 Z" fill="url(#paint)"/>
  </g>
</svg>
