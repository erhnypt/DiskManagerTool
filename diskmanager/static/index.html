<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Disk Manager</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6e6e73;--line:#d2d2d7;--pane:#f5f5f7;--sel:#0a84ff22}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f5f5f7;--mut:#98989d;--line:#38383a;--pane:#2c2c2e;--sel:#0a84ff44}}
*{box-sizing:border-box}body{margin:0;font:13px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--line);align-items:center}
header input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--pane);color:var(--fg);cursor:pointer}
#status{padding:4px 10px;color:var(--mut);border-bottom:1px solid var(--line);min-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;display:flex;min-height:0}
#tree{width:300px;overflow:auto;border-right:1px solid var(--line);padding:4px 0;background:var(--pane)}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#crumbs{padding:6px 10px;border-bottom:1px solid var(--line);color:var(--mut)}
#crumbs a{cursor:pointer;color:var(--fg)}#crumbs a:hover{text-decoration:underline}
#map{flex:1;position:relative;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%}
#types{width:230px;overflow:auto;border-left:1px solid var(--line);background:var(--pane)}
.row{display:flex;align-items:center;gap:6px;padding:2px 8px;white-space:nowrap;cursor:default}
.row:hover{background:var(--sel)}.row.sel{background:var(--sel)}
.row .n{flex:1;overflow:hidden;text-overflow:ellipsis}.row .s{color:var(--mut);font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:3px;flex:none}.tw{width:12px;color:var(--mut);cursor:pointer;flex:none;text-align:center}
#tip{position:fixed;pointer-events:none;background:#000d;color:#fff;padding:6px 8px;border-radius:6px;font-size:12px;display:none;max-width:420px;word-break:break-all}
#info{padding:6px 10px;border-top:1px solid var(--line);min-height:30px;color:var(--mut)}
@media(max-width:800px){#types{display:none}#tree{width:200px}}
</style></head><body>
<header><input id="path" placeholder="Taranacak klasör (örn. /Users/ben)"><button id="scan">Tara</button><button id="cancel">Durdur</button></header>
<div id="status">Hazır</div>
<main>
  <div id="tree"></div>
  <div id="center"><div id="crumbs"></div><div id="map"><canvas id="cv"></canvas></div><div id="info">Bir dosyanın üzerine gel. Çift tıkla: klasöre yakınlaş.</div></div>
  <div id="types"></div>
</main><div id="tip"></div>
<script>
const $=id=>document.getElementById(id);
const fmt=b=>{const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<4){b/=1024;i++}return b.toFixed(i?1:0)+' '+u[i]};
const api=(p,o)=>fetch(p,o).then(r=>r.json());
const colors={};let types=[];
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h%360};
function color(ext){if(colors[ext])return colors[ext];
  const i=types.findIndex(t=>t.ext===ext);
  const h=i>=0&&i<12?(i*137.5)%360:hue(ext);
  return colors[ext]=`hsl(${h},65%,55%)`}
let cur=[],view=null,tiles=[],selTile=null,rootPath='';
const cv=$('cv'),ctx=cv.getContext('2d');

$('scan').onclick=async()=>{const r=await api('/api/scan',{method:'POST',body:JSON.stringify({path:$('path').value})});
  if(r.error)return $('status').textContent=r.error;poll()};
$('cancel').onclick=()=>api('/api/cancel',{method:'POST',body:'{}'});

async function poll(){
  const s=await api('/api/status');rootPath=s.root||'';if(s.root&&!$('path').value)$('path').value=s.root;
  if(s.running){$('status').textContent=`Taranıyor… ${s.files.toLocaleString()} dosya, ${fmt(s.bytes)} — ${s.current}`;return setTimeout(poll,400)}
  if(s.done){$('status').textContent=`Bitti: ${s.files.toLocaleString()} dosya, ${fmt(s.bytes)}`+(s.errors?` (${s.errors} erişilemeyen öğe)`:'');await load()}
}
async function load(){
  types=await api('/api/types');for(const k in colors)delete colors[k];
  renderTypes();cur=[];await navigate([]);renderTree()
}
async function navigate(parts){cur=parts;view=await api('/api/node?depth=5&path='+encodeURIComponent(parts.join('/')));
  selTile=null;crumbs();draw();markTree()}
function crumbs(){const c=$('crumbs');c.innerHTML='';
  const add=(label,parts)=>{const a=document.createElement('a');a.textContent=label;a.onclick=()=>navigate(parts);c.append(a)};
  add(rootPath||'/',[]);cur.forEach((p,i)=>{c.append(' / ');add(p,cur.slice(0,i+1))});
  c.append(`  —  ${fmt(view.size)}`)}

// Squarified treemap
function squarify(items,x,y,w,h){
  const total=items.reduce((a,i)=>a+i.size,0);if(!total||w<1||h<1)return[];
  const out=[];let rest=items.filter(i=>i.size>0).map(i=>({it:i,a:i.size/total*w*h}));
  while(rest.length){
    const short=Math.min(w,h);let row=[],sum=0,worst=Infinity;
    const wr=(r,s)=>{const mx=Math.max(...r.map(v=>v.a)),mn=Math.min(...r.map(v=>v.a));return Math.max(short*short*mx/(s*s),s*s/(short*short*mn))};
    while(rest.length){const n=rest[0],r2=[...row,n],s2=sum+n.a,w2=wr(r2,s2);
      if(row.length&&w2>worst)break;row=r2;sum=s2;worst=w2;rest.shift()}
    const thick=sum/short;let off=0;
    for(const v of row){const len=v.a/thick;
      const r=w>=h?{x:x,y:y+off,w:thick,h:len}:{x:x+off,y:y,w:len,h:thick};
      out.push({it:v.it,...r});off+=len}
    if(w>=h){x+=thick;w-=thick}else{y+=thick;h-=thick}
  }return out}
function layout(node,x,y,w,h,path,top,out){
  const items=squarify(node.children||[],x,y,w,h);
  for(const r of items){const p=[...path,r.it.name];
    if(r.it.dir&&r.it.children&&r.it.children.length){
      const pad=r.w>8&&r.h>8?1:0;layout(r.it,r.x+pad,r.y+pad,r.w-2*pad,r.h-2*pad,p,top||r.it.name,out)}
    else out.push({...r,path:p,top:top||r.it.name,dirEmpty:r.it.dir})}}
function draw(){
  const W=cv.clientWidth,H=cv.clientHeight,dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);tiles=[];if(!view)return;layout(view,0,0,W,H,cur,null,tiles);
  for(const t of tiles){ctx.fillStyle=t.dirEmpty?'#8e8e93':color(t.it.ext);ctx.fillRect(t.x,t.y,Math.max(t.w-1,0),Math.max(t.h-1,0))}
  if(selTile){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(selTile.x+1,selTile.y+1,selTile.w-3,selTile.h-3)}
}
const hit=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;return tiles.find(t=>x>=t.x&&x<t.x+t.w&&y>=t.y&&y<t.y+t.h)};
cv.onmousemove=e=>{const t=hit(e),tip=$('tip');if(!t){tip.style.display='none';return}
  tip.style.display='block';tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px';
  tip.textContent=`${t.path.join('/')}\n${fmt(t.it.size)}`;tip.style.whiteSpace='pre'};
cv.onmouseleave=()=>$('tip').style.display='none';
cv.onclick=e=>{selTile=hit(e)||null;draw();if(selTile)$('info').textContent=`${rootPath}/${selTile.path.join('/')} — ${fmt(selTile.it.size)}`};
cv.ondblclick=e=>{const t=hit(e);if(t){const parts=t.path.slice(0,t.path.length-1);navigate(parts.length>cur.length?parts.slice(0,cur.length+1):parts)}};
addEventListener('resize',draw);

function renderTypes(){const el=$('types');el.innerHTML='';const tot=types.reduce((a,t)=>a+t.size,0)||1;
  for(const t of types.slice(0,60)){const r=document.createElement('div');r.className='row';
    r.innerHTML=`<span class="sw" style="background:${color(t.ext)}"></span><span class="n">${t.ext}</span><span class="s">${fmt(t.size)} · ${(t.size/tot*100).toFixed(1)}%</span>`;
    r.title=`${t.count.toLocaleString()} dosya`;el.append(r)}}

// Lazy folder tree
async function renderTree(){const el=$('tree');el.innerHTML='';const root=await api('/api/node?depth=1&path=');
  el.append(treeRow(root,[],0,root.size))}
function treeRow(n,path,depth,total){const wrap=document.createElement('div');
  const row=document.createElement('div');row.className='row';row.style.paddingLeft=8+depth*14+'px';row.dataset.path=path.join('/');
  const tw=document.createElement('span');tw.className='tw';tw.textContent=n.dir?'▸':'';
  row.append(tw);row.insertAdjacentHTML('beforeend',`<span class="n">${n.dir?'📁':'📄'} ${esc(n.name)}</span><span class="s">${fmt(n.size)}</span>`);
  const kids=document.createElement('div');kids.hidden=true;let loaded=false;
  async function toggle(){if(!n.dir)return;if(!loaded){loaded=true;const d=await api('/api/node?depth=1&path='+encodeURIComponent(path.join('/')));
      for(const c of d.children||[])kids.append(treeRow(c,[...path,c.name],depth+1,total))}
    kids.hidden=!kids.hidden;tw.textContent=kids.hidden?'▸':'▾'}
  tw.onclick=e=>{e.stopPropagation();toggle()};
  row.onclick=()=>{if(n.dir)navigate(path);else navigate(path.slice(0,-1))};
  wrap.append(row,kids);return wrap}
function markTree(){document.querySelectorAll('#tree .row').forEach(r=>r.classList.toggle('sel',r.dataset.path===cur.join('/')))}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
poll();
</script></body></html>
